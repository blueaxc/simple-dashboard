<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- Sidebar + Topnav -->
  <div class="d-flex">
    <nav class="bg-dark text-white p-3 min-vh-100" style="width: 250px;">
      <h4 class="mb-4">AdminLTE</h4>
      <ul class="nav flex-column">
        <li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-white">Widgets</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-white">Forms</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-white">Tables</a></li>
      </ul>
    </nav>

    <div class="flex-grow-1 p-4">
      <!-- Top Nav -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Dashboard</h2>
        <div>
          <i class="fa fa-user-circle fa-2x"></i>
        </div>
      </div>

      <!-- Info Cards -->
      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="card text-white bg-primary">
            <div class="card-body">
              <h5 class="card-title">150</h5>
              <p class="card-text">New Orders</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-success">
            <div class="card-body">
              <h5 class="card-title">53%</h5>
              <p class="card-text">Bounce Rate</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-dark bg-warning">
            <div class="card-body">
              <h5 class="card-title">44</h5>
              <p class="card-text">User Registrations</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-danger">
            <div class="card-body">
              <h5 class="card-title">65</h5>
              <p class="card-text">Unique Visitors</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="row">
        <div class="col-md-6">
          <canvas id="salesChart" height="150"></canvas>
        </div>
        <div class="col-md-6">
          <div class="bg-light p-4">
            <h5>Sales Map Placeholder</h5>
            <div class="bg-secondary" style="height: 150px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/scripts.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
